# ============================================================
# 好物集市 — application.yml
# 适配 SpringBoot 4.1.0 + JDK21
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: goods-market-backend

  # ==================== 数据源配置 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/goods_market_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  # ==================== Jackson 序列化配置 ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ==================== 文件上传限制 ====================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 开启驼峰命名映射
    map-underscore-to-camel-case: true
    # SQL日志（生产环境设为 false）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 主键策略：雪花算法
      id-type: ASSIGN_ID

# ==================== Sa-Token 配置 ====================
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（单位：秒，默认30天）= 2592000
  timeout: 2592000
  # token 最低活跃频率（单位：秒，-1表示不限）
  active-timeout: -1
  # 是否允许同一账号多地同时登录（true=允许，false=新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token
  is-share: false
  # token 风格：uuid / simple-uuid / random-32 / random-64 / random-128 / tik
  token-style: simple-uuid
  # 是否输出操作日志
  is-log: false
  # token 前缀（用于 Authorization: Bearer xxx）
  token-prefix: Bearer

# ==================== 阿里云短信配置（占位） ====================
aliyun:
  sms:
    # 阿里云 AccessKey ID
    access-key-id: YOUR_ACCESS_KEY_ID
    # 阿里云 AccessKey Secret
    access-key-secret: YOUR_ACCESS_KEY_SECRET
    # 短信签名
    sign-name: 好物集市
    # 短信模板ID（验证码模板）
    template-code: SMS_000000000
    # 短信API endpoint
    endpoint: dysmsapi.aliyuncs.com

# ==================== 微信支付V3配置（占位） ====================
wechat:
  pay:
    # 商户号
    mch-id: "1600000000"
    # 商户API证书序列号
    mch-serial-no: YOUR_MCH_SERIAL_NO
    # 商户私钥文件路径（resources目录下）
    private-key-path: cert/apiclient_key.pem
    # 微信支付公钥ID（用于验签）
    public-key-id: YOUR_PUBLIC_KEY_ID
    # 微信支付公钥文件路径
    public-key-path: cert/wechatpay_public_key.pem
    # APIv3 密钥
    api-v3-key: YOUR_API_V3_KEY
    # 回调地址（需公网可访问）
    notify-url: https://your-domain.com/api/pay/wx/notify
    # 退款回调地址
    refund-notify-url: https://your-domain.com/api/pay/wx/refund/notify

# ==================== 日志配置 ====================
logging:
  level:
    com.market.goods: debug
    com.market.goods.mapper: debug
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
